name: Trigger auto deployment for fwd-tg-bot

# When this action will be executed
on:
  # Automatically trigger it when detected changes in repo
  push:
    branches: 
      [ master ]
    paths:
    - '**'
    - '.github/workflows/fwd-tg-bot-AutoDeployTrigger-cec269d0-2b7d-4e0c-9762-fcc097a4747c.yml'

  # Allow manual trigger 
  workflow_dispatch:      

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions: 
      id-token: write #This is required for requesting the OIDC JWT Token
      contents: read #Required when GH token is used to authenticate with private repo

    steps:
      - name: Checkout to the branch
        uses: actions/checkout@v2

      - name: Azure Login
        uses: azure/login@v1
        with:
          client-id: ${{ secrets.FWDTGBOT_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.FWDTGBOT_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.FWDTGBOT_AZURE_SUBSCRIPTION_ID }}

      - name: Build and push container image to registry
        uses: azure/container-apps-deploy-action@v2
        with:
          appSourcePath: ${{ github.workspace }} 
          registryUrl: docker.io
          registryUsername: ${{ secrets.FWDTGBOT_REGISTRY_USERNAME }}
          registryPassword: ${{ secrets.FWDTGBOT_REGISTRY_PASSWORD }}
          containerAppName: fwd-tg-bot
          resourceGroup: FWD_TG_BOT
          imageToBuild: rinser/fwd-tg-bot:${{ github.sha }}
          _buildArgumentsKey_: |
            _buildArgumentsValues_


